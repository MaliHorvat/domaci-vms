# go2rtc – pretvarja slike kamer za živo sliko (tokove dodaja strežnik VMS samodejno)
api:
  listen: ":1984"        # samo znotraj Dockerja; aplikacije dostopajo prek strežnika VMS
  origin: "*"
rtsp:
  listen: ":8554"        # samo znotraj Dockerja
webrtc:
  listen: ":8555"
  candidates:
    - ${HOST_IP:127.0.0.1}:${WEBRTC_PORT:8555}    # naslov NAS-a doma (HOST_IP v .env)
    - ${VPN_HOST:127.0.0.1}:${WEBRTC_PORT:8555}   # naslov NAS-a v VPN-ju (VPN_HOST v .env)
ffmpeg:
  bin: ffmpeg
log:
  level: warn
