# Domači VMS – strežnik za NAS ali mini PC
#
# Zagon:                          docker compose up -d --build
# Z dostopom od zunaj (Tailscale): docker compose --profile vpn up -d --build   (TS_AUTHKEY v .env)
# Z AI zaznavanjem oseb in vozil: dodajte --profile ai
#
# Strežnik ni objavljen na internetu. Od zunaj je dosegljiv samo prek zasebnega VPN-ja.

name: domaci-vms

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: vms-go2rtc
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Ljubljana}
      - HOST_IP=${HOST_IP:-127.0.0.1}
      - VPN_HOST=${VPN_HOST:-127.0.0.1}
    volumes:
      - ./go2rtc:/config:ro
    ports:
      - "8555:8555/tcp"      # WebRTC: živa slika z najmanjšim zamikom (doma in prek VPN-ja)
      - "8555:8555/udp"

  vms:
    build: ./vms
    image: domaci-vms/vms:2.0
    container_name: vms-streznik
    restart: unless-stopped
    depends_on: [go2rtc]
    environment:
      - TZ=${TZ:-Europe/Ljubljana}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Spremeni-me-2026}
      - SECRET_KEY=${SECRET_KEY:-}
      - AI_TOKEN=${AI_TOKEN:-}
      - GO2RTC_API=http://go2rtc:1984
      - GO2RTC_RTSP=rtsp://go2rtc:8554
      - SYSTEM_NAME=${SYSTEM_NAME:-Doma}
      - SEGMENT_SECONDS=60
      - HOST_IP=${HOST_IP:-}
      - VPN_HOST=${VPN_HOST:-}
      - VMS_PORT=${VMS_PORT:-8080}
      - REMEMBER_DAYS=${REMEMBER_DAYS:-60}
      - DATA_HOST_PATH=./data/vms
    volumes:
      - ./data/vms:/data                              # nastavitve in vgrajena baza
      - ${RECORDINGS_PATH:-./recordings}:/recordings  # posnetki (na NAS-u npr. /volume1/kamere)
    ports:
      - "${VMS_PORT:-8080}:8080"

  # Zasebni VPN Tailscale: NAS se pridruži vašemu omrežju Tailscale, kjer ga vidijo le vaše naprave.
  # Ne odpira vrat na usmerjevalniku. Če že imate WireGuard na usmerjevalniku ali NAS-u, tega ne potrebujete.
  tailscale:
    image: tailscale/tailscale:stable
    container_name: vms-tailscale
    restart: unless-stopped
    profiles: ["vpn"]
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-domaci-vms}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./data/tailscale:/var/lib/tailscale

  ai:
    build: ./ai
    image: domaci-vms/ai:1.0
    container_name: vms-ai
    restart: unless-stopped
    profiles: ["ai"]
    depends_on: [vms]
    environment:
      - TZ=${TZ:-Europe/Ljubljana}
      - VMS_URL=http://vms:8080
      - AI_TOKEN=${AI_TOKEN:-}
      - GO2RTC_RTSP=rtsp://go2rtc:8554
      - MODEL=${AI_MODEL:-yolo11n.pt}
      - DEVICE=cpu
